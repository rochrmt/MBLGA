# ============================================================
#  AGEO — Configuration Nginx (reverse proxy)
#  Proxy vers le conteneur app (port 3001)
#  Support HTTP + HTTPS (certificats à fournir dans nginx/certs/)
# ============================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;

  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 15m;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ── Upstream vers l'app ────────────────────────────────────────────────
  upstream ageo_app {
    server app:3001;
  }

  # ── HTTP (port 80) ──────────────────────────────────────────────────────
  # Sert l'app en HTTP. Si des certificats SSL sont présents,
  # décommentez le bloc de redirection HTTPS ci-dessous.
  server {
    listen 80;
    server_name _;

    # ── Redirection HTTPS (décommenter après avoir ajouté des certificats) ──
    # return 301 https://$host$request_uri;

    # Proxy vers l'app
    location / {
      proxy_pass http://ageo_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 90;
      proxy_send_timeout 90;
    }

    # Cache des fichiers statiques (assets frontend)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      proxy_pass http://ageo_app;
      proxy_cache_valid 200 1d;
      expires 1d;
      add_header Cache-Control "public, immutable";
    }
  }

  # ── HTTPS (port 443) ────────────────────────────────────────────────────
  # Décommentez ce bloc après avoir placé vos certificats dans nginx/certs/
  # (fullchain.pem et privkey.pem)
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name votre-domaine.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #
  #   location / {
  #     proxy_pass http://ageo_app;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection "upgrade";
  #     proxy_read_timeout 90;
  #     proxy_send_timeout 90;
  #   }
  #
  #   location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
  #     proxy_pass http://ageo_app;
  #     proxy_cache_valid 200 1d;
  #     expires 1d;
  #     add_header Cache-Control "public, immutable";
  #   }
  # }
}
